<main class="subpage">
  <div class="subpage-inner">
    <button class="back-btn" (click)="goBack()">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Back
    </button>

    <h1 class="subpage-title">Update Email</h1>

    <div class="form-card">
      <div class="field-group">
        <label>Current Email</label>
        <input type="email" [value]="authService.user()?.email || ''" disabled class="input-disabled">
      </div>

      <div class="field-group">
        <label>New Email Address</label>
        <input type="email" [(ngModel)]="newEmail" name="newEmail" placeholder="Enter new email address">
      </div>

      <div class="field-group">
        <label>Current Password</label>
        <div class="input-wrap">
          <input [type]="showPassword() ? 'text' : 'password'" [(ngModel)]="currentPassword" name="currentPassword" placeholder="Enter your current password">
          <button type="button" class="eye-btn" (click)="showPassword.set(!showPassword())">
            @if (showPassword()) {
              <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            } @else {
              <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            }
          </button>
        </div>
      </div>

      @if (success()) { <div class="alert-success">{{ success() }}</div> }
      @if (error())   { <div class="alert-error">{{ error() }}</div> }

      <button class="btn-save" (click)="save()" [disabled]="saving() || !newEmail.trim() || !currentPassword">
        {{ saving() ? 'Updating...' : 'Update Email' }}
      </button>
    </div>
  </div>
</main>
