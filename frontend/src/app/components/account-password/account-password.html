<main class="subpage">
  <div class="subpage-inner">
    <button class="back-btn" (click)="goBack()">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Back
    </button>

    <h1 class="subpage-title">Update Password</h1>

    <div class="form-card">
      <div class="field-group">
        <label>Current Password</label>
        <div class="input-wrap">
          <input [type]="showCurrent() ? 'text' : 'password'" [(ngModel)]="pwForm.current" name="current" placeholder="Enter current password">
          <button type="button" class="eye-btn" (click)="showCurrent.set(!showCurrent())">
            @if (showCurrent()) {
              <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            } @else {
              <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            }
          </button>
        </div>
      </div>

      <div class="field-group">
        <label>New Password</label>
        <div class="input-wrap">
          <input [type]="showNew() ? 'text' : 'password'" [(ngModel)]="pwForm.newPw" name="newPw" placeholder="Enter new password">
          <button type="button" class="eye-btn" (click)="showNew.set(!showNew())">
            @if (showNew()) {
              <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            } @else {
              <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            }
          </button>
        </div>
        @if (pwForm.newPw) {
          <div class="pw-requirements">
            <div class="pw-req" [class.met]="checks.length"><span class="pw-dot"></span>8+ characters</div>
            <div class="pw-req" [class.met]="checks.upper"><span class="pw-dot"></span>Uppercase</div>
            <div class="pw-req" [class.met]="checks.lower"><span class="pw-dot"></span>Lowercase</div>
            <div class="pw-req" [class.met]="checks.number"><span class="pw-dot"></span>Number</div>
            <div class="pw-req" [class.met]="checks.special"><span class="pw-dot"></span>Special char</div>
          </div>
        }
      </div>

      <div class="field-group">
        <label>Confirm New Password</label>
        <div class="input-wrap">
          <input [type]="showConfirm() ? 'text' : 'password'" [(ngModel)]="pwForm.confirm" name="confirm" placeholder="Confirm new password">
          <button type="button" class="eye-btn" (click)="showConfirm.set(!showConfirm())">
            @if (showConfirm()) {
              <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            } @else {
              <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            }
          </button>
        </div>
      </div>

      @if (success()) { <div class="alert-success">{{ success() }}</div> }
      @if (error()) { <div class="alert-error">{{ error() }}</div> }

      <button class="btn-save" (click)="save()" [disabled]="saving() || !pwForm.current || !pwValid || pwForm.newPw !== pwForm.confirm">
        {{ saving() ? 'Updating...' : 'Update Password' }}
      </button>
    </div>
  </div>
</main>
