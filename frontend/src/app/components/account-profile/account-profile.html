<main class="subpage">
  <div class="subpage-inner">
    <a routerLink="/account" class="back-btn">
      <i class="bi bi-arrow-left"></i>
      Back to Account
    </a>

    <h1 class="subpage-title">Personal Info</h1>

    <div class="form-card">
      <div class="field-row">
        <div class="field-group">
          <label>First Name</label>
          <input type="text" [(ngModel)]="profileForm.firstName" name="firstName" placeholder="First name">
        </div>
        <div class="field-group">
          <label>Last Name</label>
          <input type="text" [(ngModel)]="profileForm.lastName" name="lastName" placeholder="Last name">
        </div>
      </div>

      <div class="field-group">
        <label>Email Address</label>
        <input type="email" [value]="authService.user()?.email" disabled class="input-disabled">
      </div>

      @if (success()) { <div class="alert-success">{{ success() }}</div> }
      @if (error()) { <div class="alert-error">{{ error() }}</div> }

      <button class="btn-save" (click)="save()" [disabled]="saving()">
        {{ saving() ? 'Saving...' : 'Save Changes' }}
      </button>
    </div>
  </div>
</main>
