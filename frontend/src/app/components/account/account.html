<main class="account-page">
  <div class="account-container">

    <!-- Profile Header -->
    <div class="profile-header">
      <div class="profile-avatar">{{ userInitials }}</div>
      <div class="profile-info">
        <h1>{{ authService.user()?.firstName }} {{ authService.user()?.lastName }}</h1>
        <p>{{ authService.user()?.email }}</p>
      </div>
    </div>

    <!-- Account Menu -->
    <div class="account-grid">

      <a routerLink="/orders" class="account-card">
        <div class="card-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        </div>
        <div class="card-text">
          <span class="card-title">My Orders</span>
          <span class="card-desc">Track and view your orders</span>
        </div>
        <svg class="card-arrow" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </a>

    </div>
  </div>
</main>
