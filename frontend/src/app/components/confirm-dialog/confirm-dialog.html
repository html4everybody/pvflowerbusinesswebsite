@if (confirm.active(); as c) {
  <div class="confirm-overlay" (click)="confirm.cancel()">
    <div class="confirm-box" [class.danger]="c.danger" (click)="$event.stopPropagation()"
         role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
      <div class="confirm-icon" [class.danger]="c.danger">
        @if (c.danger) {
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>
          </svg>
        } @else {
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
        }
      </div>

      <h3 class="confirm-title" id="confirm-title">{{ c.title }}</h3>
      <p class="confirm-message">{{ c.message }}</p>

      @if (c.promptLabel) {
        <div class="confirm-prompt">
          <label>{{ c.promptLabel }}</label>
          <textarea rows="3" [placeholder]="c.promptPlaceholder"
                    [value]="confirm.reasonInput()"
                    (input)="confirm.reasonInput.set($any($event.target).value)"></textarea>
        </div>
      }

      <div class="confirm-actions">
        <button type="button" class="confirm-cancel" (click)="confirm.cancel()">{{ c.cancelText }}</button>
        <button type="button" class="confirm-ok" [class.danger]="c.danger" (click)="confirm.confirm()">{{ c.confirmText }}</button>
      </div>
    </div>
  </div>
}
