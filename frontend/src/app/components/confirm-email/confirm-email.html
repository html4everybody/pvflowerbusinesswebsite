<main class="confirm-page">
  <div class="confirm-card">
    @if (status() === 'loading') {
      <div class="spinner"></div>
      <p>Confirming your new email...</p>
    } @else if (status() === 'success') {
      <div class="icon success-icon">
        <i class="bi bi-check-circle"></i>
      </div>
      <h1>Email Confirmed!</h1>
      <p>Your email has been updated to <strong>{{ newEmail() }}</strong>. Please sign in with your new email.</p>
      <a routerLink="/signin" class="btn-primary">Sign In</a>
    } @else {
      <div class="icon error-icon">
        <i class="bi bi-x-circle"></i>
      </div>
      <h1>Confirmation Failed</h1>
      <p>{{ message() }}</p>
      <a routerLink="/account" class="btn-primary">Go to My Account</a>
    }
  </div>
</main>
