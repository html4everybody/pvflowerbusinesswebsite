<main class="forgot-page">
  <div class="forgot-card">

    <div class="logo">
      <img src="logo.png" alt="VivaPetals" class="logo-img">
    </div>

    @if (!sent()) {
      <div class="form-heading">
        <h1>Forgot password?</h1>
        <p class="subtitle">Enter your email and we'll send you a reset link</p>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrap">
          <i class="bi bi-envelope"></i>
          <input type="email" id="email" placeholder="you@gmail.com" [value]="email()" (input)="onEmailInput($event)" (keydown.enter)="send()">
        </div>
      </div>

      @if (error()) {
        <div class="error-msg">{{ error() }}</div>
      }

      <button class="btn-submit" (click)="send()" [disabled]="loading() || !email().trim()">
        @if (loading()) {
          <i class="bi bi-arrow-repeat spin-icon"></i>
          Sending...
        } @else {
          Send Reset Link
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        }
      </button>
    } @else {
      <div class="success-block">
        <div class="success-icon">
          <i class="bi bi-check-circle"></i>
        </div>
        <h1>Check your inbox</h1>
        <p class="subtitle">We've sent a password reset link to <strong>{{ email() }}</strong></p>
      </div>
    }

    <a routerLink="/signin" class="back-link">
      <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      Back to Sign In
    </a>

  </div>
</main>
